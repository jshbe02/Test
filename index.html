    /**
     * =========================================================================
     * 3. TYPO-TOLERANT BILINGUAL FUZZY SEARCH ENGINE (KO + EN)
     *    - Hangul Jamo decomposition (문스튼 -> 문스톤, 펠리컨 -> 펠리칸, 마르밸 -> 마르벨)
     *    - Hangul Choseong matching (ㅁㅅㅌ, ㅍㄹㅋ, ㅂㄹㅇㄱ, ㄱㄹㅇㅅ, ㅋㄹㄱ)
     *    - Normalized Damerau-Levenshtein + Bigram/Trigram Dice + Subsequence
     * =========================================================================
     */
    const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const JUNGSEONG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JONGSEONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const CHOSEONG_SET = new Set(CHOSEONG);

    function normalizeText(str) {
      if (!str) return '';
      return String(str)
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/['’"`\-_.,/&():!?·×→]/g, '')
        .replace(/\s+/g, '');
    }

    function normalizeWords(str) {
      if (!str) return [];
      return String(str)
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/['’"`\-_.,/&():!?·×→]/g, ' ')
        .split(/\s+/)
        .filter(Boolean);
    }

    function toChoseong(str) {
      let out = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          out += CHOSEONG[Math.floor((code - 0xAC00) / 588)];
        } else if (CHOSEONG_SET.has(str[i])) {
          out += str[i];
        }
      }
      return out;
    }

    function toJamo(str) {
      let out = '';
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        const code = str.charCodeAt(i);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          const offset = code - 0xAC00;
          const cho = Math.floor(offset / 588);
          const jung = Math.floor((offset % 588) / 28);
          const jong = offset % 28;
          out += CHOSEONG[cho] + JUNGSEONG[jung] + JONGSEONG[jong];
        } else {
          out += ch;
        }
      }
      return out;
    }

    function isPureChoseong(str) {
      if (!str) return false;
      for (let i = 0; i < str.length; i++) {
        if (!CHOSEONG_SET.has(str[i])) return false;
      }
      return true;
    }

    function damerauLevenshtein(a, b) {
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;

      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
          if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
            dp[i][j] = Math.min(dp[i][j], dp[i - 2][j - 2] + 1);
          }
        }
      }
      return dp[m][n];
    }

    function editSimilarity(a, b) {
      const maxLen = Math.max(a.length, b.length);
      if (maxLen === 0) return 1;
      return 1 - damerauLevenshtein(a, b) / maxLen;
    }

    function ngramDice(a, b, n) {
      if (a.length < n || b.length < n) return 0;
      const map = new Map();
      for (let i = 0; i <= a.length - n; i++) {
        const g = a.slice(i, i + n);
        map.set(g, (map.get(g) || 0) + 1);
      }
      let overlap = 0;
      for (let i = 0; i <= b.length - n; i++) {
        const g = b.slice(i, i + n);
        const cnt = map.get(g) || 0;
        if (cnt > 0) {
          map.set(g, cnt - 1);
          overlap++;
        }
      }
      return (2 * overlap) / (a.length - n + 1 + b.length - n + 1);
    }

    function subsequenceScore(query, target) {
      if (!query || query.length > target.length) return 0;
      let qi = 0;
      let firstIdx = -1;
      let lastIdx = -1;
      let consecutive = 0;
      let prevIdx = -2;
      for (let ti = 0; ti < target.length && qi < query.length; ti++) {
        if (target[ti] === query[qi]) {
          if (firstIdx === -1) firstIdx = ti;
          if (ti === prevIdx + 1) consecutive++;
          prevIdx = ti;
          lastIdx = ti;
          qi++;
        }
      }
      if (qi < query.length) return 0;
      const span = lastIdx - firstIdx + 1;
      return 0.55 * (query.length / span) + 0.45 * (consecutive / Math.max(1, query.length - 1));
    }

    // Precompute index for instant zero-lag search across all 40 entries
    const SEARCH_INDEX = LOCATIONS.map((item) => {
      const codeFields = item.codes.flatMap((c) => [c.code, c.alt, c.labelEn, c.labelKo].filter(Boolean));
      const regionNames = [
        I18N.ko.regions[item.region],
        I18N.en.regions[item.region],
        item.subRegionEn,
        item.subRegionKo
      ].filter(Boolean);
      const rewardNames = [
        item.rewardDetailEn,
        item.rewardDetailKo,
        ...item.rewards.flatMap((r) => [I18N.ko.rewards[r], I18N.en.rewards[r]])
      ].filter(Boolean);

      const highPriority = [item.en, item.ko, ...codeFields, ...regionNames, ...rewardNames, ...(item.aliases || [])];
      const tipPriority = [item.tipEn, item.tipKo, item.clueEn, item.clueKo].filter(Boolean);

      const makeTarget = (raw, weight) => {
        const norm = normalizeText(raw);
        const words = normalizeWords(raw).map((w) => ({ norm: w, jamo: toJamo(w) }));
        return {
          norm,
          jamo: toJamo(norm),
          choseong: toChoseong(norm),
          words,
          weight
        };
      };

      return {
        item,
        targets: [
          ...highPriority.map((s, idx) => makeTarget(s, idx < 2 ? 1.1 : 1.0)),
          ...tipPriority.map((s) => makeTarget(s, 0.72))
        ]
      };
    });

    function scoreToken(qNorm, qJamo, qIsCho, target) {
      if (!target.norm) return { score: 0, fuzzy: false };

      if (target.norm === qNorm) return { score: 1000 * target.weight, fuzzy: false };
      if (target.norm.startsWith(qNorm)) return { score: 890 * target.weight, fuzzy: false };

      let best = 0;
      for (const w of target.words) {
        if (w.norm === qNorm) return { score: 930 * target.weight, fuzzy: false };
        if (w.norm.startsWith(qNorm)) best = Math.max(best, 840);
      }

      if (target.norm.includes(qNorm)) best = Math.max(best, 750);

      if (qIsCho && target.choseong) {
        if (target.choseong.startsWith(qNorm)) best = Math.max(best, 790);
        else if (target.choseong.includes(qNorm)) best = Math.max(best, 710);
      }

      if (best > 0) return { score: best * target.weight, fuzzy: false };
      if (qJamo.length < 2) return { score: 0, fuzzy: false };

      // Incomplete Hangul syllable prefix/substring in Jamo
      if (target.jamo.includes(qJamo)) {
        return { score: 670 * target.weight, fuzzy: false };
      }

      let fuzzy = false;

      // Word-level fuzzy comparison (Levenshtein + bigram/trigram Dice)
      for (const w of target.words) {
        if (Math.abs(w.jamo.length - qJamo.length) <= Math.max(3, Math.ceil(qJamo.length * 0.5))) {
          const sim = editSimilarity(qJamo, w.jamo);
          const dice = Math.max(ngramDice(qJamo, w.jamo, 2), ngramDice(qJamo, w.jamo, 3));
          const combined = Math.max(sim, sim * 0.65 + dice * 0.35);
          if (combined >= 0.62) {
            const pts = 350 + combined * 310;
            if (pts > best) { best = pts; fuzzy = true; }
          }
        }
        if (w.jamo.length > qJamo.length && qJamo.length >= 4) {
          const slice = w.jamo.slice(0, qJamo.length + 1);
          const sim = editSimilarity(qJamo, slice);
          if (sim >= 0.72) {
            const pts = 330 + sim * 290;
            if (pts > best) { best = pts; fuzzy = true; }
          }
        }
      }

      // Full normalized string comparison + sliding window for compound names
      if (Math.abs(target.jamo.length - qJamo.length) <= Math.max(4, Math.ceil(qJamo.length * 0.55))) {
        const sim = editSimilarity(qJamo, target.jamo);
        const dice = Math.max(ngramDice(qJamo, target.jamo, 2), ngramDice(qJamo, target.jamo, 3));
        const combined = Math.max(sim, sim * 0.6 + dice * 0.4);
        if (combined >= 0.60) {
          const pts = 340 + combined * 300;
          if (pts > best) { best = pts; fuzzy = true; }
        }
      } else if (target.jamo.length > qJamo.length && qJamo.length >= 4) {
        const winLen = qJamo.length;
        const step = winLen >= 6 ? 2 : 1;
        for (let i = 0; i <= target.jamo.length - winLen; i += step) {
          const sim = editSimilarity(qJamo, target.jamo.slice(i, i + winLen));
          if (sim >= 0.72) {
            const pts = 310 + sim * 280;
            if (pts > best) { best = pts; fuzzy = true; }
          }
        }
      }

      // Ordered subsequence fallback (pelcan -> pelican, kalga -> kalaga, broks -> brooks)
      if (qJamo.length >= 3) {
        const subRatio = subsequenceScore(qJamo, target.jamo);
        if (subRatio >= 0.64) {
          const pts = 270 + subRatio * 290;
          if (pts > best) { best = pts; fuzzy = true; }
        }
      }

      return { score: best * target.weight, fuzzy };
    }

    function runFuzzySearch(rawQuery) {
      const trimmed = rawQuery.trim();
      if (!trimmed) {
        return SEARCH_INDEX.map((entry) => ({ item: entry.item, score: 1, isFuzzy: false }));
      }

      const fullNorm = normalizeText(trimmed);
      const fullJamo = toJamo(fullNorm);
      const fullIsCho = isPureChoseong(fullNorm);
      const tokens = normalizeWords(trimmed).map((t) => ({
        norm: t,
        jamo: toJamo(t),
        isCho: isPureChoseong(t)
      }));

      const scored = [];

      for (const entry of SEARCH_INDEX) {
        let fullBest = { score: 0, fuzzy: false };
        for (const target of entry.targets) {
          const res = scoreToken(fullNorm, fullJamo, fullIsCho, target);
          if (res.score > fullBest.score) fullBest = res;
        }

        let tokenScore = 0;
        let tokenFuzzy = false;
        if (tokens.length > 1) {
          let sum = 0;
          let hits = 0;
          for (const tk of tokens) {
            let tkBest = { score: 0, fuzzy: false };
            for (const target of entry.targets) {
              const res = scoreToken(tk.norm, tk.jamo, tk.isCho, target);
              if (res.score > tkBest.score) tkBest = res;
            }
            if (tkBest.score >= 300) {
              hits++;
              sum += tkBest.score;
              if (tkBest.fuzzy) tokenFuzzy = true;
            }
          }
          if (hits === tokens.length) {
            tokenScore = (sum / tokens.length) * 1.06;
          } else if (hits > 0 && hits >= Math.ceil(tokens.length * 0.6)) {
            tokenScore = (sum / tokens.length) * 0.78;
            tokenFuzzy = true;
          }
        }

        const finalScore = Math.max(fullBest.score, tokenScore);
        const finalFuzzy = fullBest.score >= tokenScore ? fullBest.fuzzy : tokenFuzzy;

        if (finalScore >= 360) {
          scored.push({ item: entry.item, score: finalScore, isFuzzy: finalFuzzy });
        }
      }

      scored.sort((a, b) => b.score - a.score);
      return scored;
    }

    /**

    let toastTimer = null;

    function copyToClipboard(text) {

        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) return true;
      } catch (err) {
        console.warn('execCommand copy error:', err);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return true;
      }
      return false;
    }

    function showToast(msg) {

      inner.classList.remove('toast-enter');
      void inner.offsetWidth;
      inner.classList.add('toast-enter');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => container.classList.add('hidden'), 1800);
    }

    /**

     */
    const REGION_ORDER = ['all', 'vice-city', 'port-gellhorn', 'leonard-county', 'grassrivers', 'other'];

          return 'bg-amber-500/15 text-amber-300 border-amber-500/35';
        case 'vehicle':
          return 'bg-cyan-500/15 text-cyan-300 border-cyan-500/35';
        case 'collectible':
          return 'bg-purple-500/15 text-purple-300 border-purple-500/35';
        case 'cash':
          return 'bg-emerald-500/12 text-emerald-300 border-emerald-500/25';
        case 'mission':
          return 'bg-blue-500/12 text-blue-300 border-blue-500/25';
        default:
          return 'bg-gray-500/15 text-gray-300 border-gray-500/25';
      }
    }

    function getRewardIcon(reward) {
      switch (reward) {
        case 'weapon': return '🔫';
        case 'vehicle': return '🚗';
        case 'collectible': return '✨';
        case 'cash': return '💵';
        case 'mission': return '★';
        default: return '';
      }
    }

    function updateStaticChrome() {
      const t = I18N[state.lang];
      document.documentElement.lang = state.lang;
      document.getElementById('appTitle').textContent = t.appTitle;
      document.getElementById('guideBtnLabel').textContent = t.guideBtn;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('uncompletedLabel').textContent = t.uncompletedOnly;
      document.getElementById('regionFilterLabel').textContent = t.regionLabel;
      document.getElementById('rewardFilterLabel').textContent = t.rewardLabel;
      document.getElementById('categoryFilterLabel').textContent = t.categoryLabel;
      document.getElementById('resetAllFiltersText').textContent = t.resetAllFilters;
      document.getElementById('leadingZeroGlobalTip').textContent = t.leadingZeroGlobal;
      document.getElementById('emptyTitle').textContent = t.emptyTitle;
      document.getElementById('emptyDesc').textContent = t.emptyDesc;
      document.getElementById('emptyResetBtn').textContent = t.emptyReset;
      document.getElementById('footerNote').textContent = t.footerNote;
      document.getElementById('copyPageUrlText').textContent = t.copyPageUrl;
      document.getElementById('resetModalTitle').textContent = t.resetModalTitle;
      document.getElementById('resetModalDesc').textContent = t.resetModalDesc;
      document.getElementById('cancelResetBtn').textContent = t.cancel;
      document.getElementById('confirmResetBtn').textContent = t.confirmReset;
      document.getElementById('guideModalTitle').textContent = t.guideModalTitle;
      document.getElementById('guideModalBody').innerHTML = t.guideModalHtml;
      document.getElementById('guideModalOkBtn').textContent = t.guideModalOk;

      // Language toggle highlight
      const koBtn = document.getElementById('langKoBtn');
      const enBtn = document.getElementById('langEnBtn');
      if (state.lang === 'ko') {
        koBtn.className = 'px-2.5 py-1 text-xs font-extrabold rounded-lg bg-viceCyan text-gray-950 transition cursor-pointer';
        enBtn.className = 'px-2.5 py-1 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition cursor-pointer';
      } else {
        enBtn.className = 'px-2.5 py-1 text-xs font-extrabold rounded-lg bg-viceCyan text-gray-950 transition cursor-pointer';
        koBtn.className = 'px-2.5 py-1 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition cursor-pointer';
      }
    }

    function updateProgressUI() {
      const t = I18N[state.lang];
      const total = LOCATIONS.length;
      const done = state.checkedIds.size;
      const pct = Math.round((done / total) * 100);
      document.getElementById('progressText').textContent = t.progressText(done, total, pct);
      document.getElementById('progressBarFill').style.width = `${pct}%`;

      // Uncompleted toggle pill visual state
      const btn = document.getElementById('uncompletedToggleBtn');
      const dot = document.getElementById('uncompletedDot');
      btn.setAttribute('aria-pressed', String(state.uncompletedOnly));
      if (state.uncompletedOnly) {
        btn.className = 'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold border transition cursor-pointer shrink-0 bg-cyan-400/15 border-viceCyan/60 text-viceCyan';
        dot.className = 'w-2 h-2 rounded-full bg-viceCyan shadow-[0_0_8px_#22D3EE] transition';
      } else {
        btn.className = 'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition cursor-pointer shrink-0 bg-obsidian border-borderCrisp text-gray-300 hover:text-white hover:border-gray-600';
        dot.className = 'w-2 h-2 rounded-full bg-gray-600 transition';
      }
    }

    function matchesFilters(item, ignoreKey) {
      if (state.uncompletedOnly && state.checkedIds.has(item.id)) return false;
      if (ignoreKey !== 'region' && state.region !== 'all' && item.region !== state.region) return false;
      if (ignoreKey !== 'reward' && state.reward !== 'all' && !item.rewards.includes(state.reward)) return false;
      if (ignoreKey !== 'category' && state.category !== 'all' && item.category !== state.category) return false;
      return true;
    }

    function renderFilterBars(searchResults) {
      const t = I18N[state.lang];

      // 1. Region pills (counts respect search + other active filters)
      const regionCounts = Object.fromEntries(REGION_ORDER.map((r) => [r, 0]));
      for (const r of searchResults) {
        if (!matchesFilters(r.item, 'region')) continue;
        regionCounts.all++;
        regionCounts[r.item.region]++;
      }
      document.getElementById('regionFilterBar').innerHTML = REGION_ORDER.map((reg) => {
        const active = state.region === reg;
        const cls = active
          ? 'bg-viceCyan text-gray-950 border-viceCyan font-extrabold'
          : 'bg-obsidian text-gray-300 border-borderCrisp hover:border-gray-600 hover:text-white font-medium';
        const cntCls = active ? 'bg-gray-950/15 text-gray-950' : 'bg-slateCard text-gray-400';
        return `
          <button type="button" data-filter="region" data-val="${reg}" class="filter-pill shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border text-xs transition cursor-pointer ${cls}">
            <span>${escapeHtml(t.regions[reg])}</span>
            <span class="px-1.5 py-0.2 rounded-md text-[10px] font-mono font-bold ${cntCls}">${regionCounts[reg]}</span>
          </button>
        `;
      }).join('');

      // 2. Reward pills
      const rewardCounts = Object.fromEntries(REWARD_ORDER.map((r) => [r, 0]));
      for (const r of searchResults) {
        if (!matchesFilters(r.item, 'reward')) continue;
        rewardCounts.all++;
        for (const rw of r.item.rewards) {
          if (rewardCounts[rw] !== undefined) rewardCounts[rw]++;
        }
      }
      document.getElementById('rewardFilterBar').innerHTML = REWARD_ORDER.map((rw) => {
        const active = state.reward === rw;
        let cls;
        if (active) {
          cls = rw === 'weapon' ? 'bg-amber-400 text-gray-950 border-amber-400 font-extrabold'
              : rw === 'vehicle' ? 'bg-viceCyan text-gray-950 border-viceCyan font-extrabold'
              : rw === 'collectible' ? 'bg-purple-400 text-gray-950 border-purple-400 font-extrabold'
              : rw === 'cash' ? 'bg-emerald-400 text-gray-950 border-emerald-400 font-extrabold'
              : rw === 'mission' ? 'bg-blue-400 text-gray-950 border-blue-400 font-extrabold'
              : 'bg-white text-gray-950 border-white font-extrabold';
        } else {
          cls = 'bg-obsidian text-gray-300 border-borderCrisp hover:border-gray-600 hover:text-white font-medium';
        }
        const cntCls = active ? 'bg-gray-950/15 text-gray-950' : 'bg-slateCard text-gray-400';
        const icon = rw !== 'all' ? `<span class="text-[11px] leading-none">${getRewardIcon(rw)}</span>` : '';
        return `
          <button type="button" data-filter="reward" data-val="${rw}" class="filter-pill shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border text-xs transition cursor-pointer ${cls}">
            ${icon}
            <span>${escapeHtml(t.rewards[rw])}</span>
            <span class="px-1.5 py-0.2 rounded-md text-[10px] font-mono font-bold ${cntCls}">${rewardCounts[rw]}</span>
          </button>
        `;
      }).join('');

      // 3. Category quick filter pills
      const catCounts = Object.fromEntries(CATEGORY_ORDER.map((c) => [c, 0]));
      for (const r of searchResults) {
        if (!matchesFilters(r.item, 'category')) continue;
        catCounts.all++;
        catCounts[r.item.category]++;
      }
      document.getElementById('categoryFilterBar').innerHTML = CATEGORY_ORDER.map((cat) => {
        const active = state.category === cat;
        const cls = active
          ? 'bg-viceCoral text-gray-950 border-viceCoral font-extrabold'
          : 'bg-obsidian text-gray-300 border-borderCrisp hover:border-gray-600 hover:text-white font-medium';
        const cntCls = active ? 'bg-gray-950/15 text-gray-950' : 'bg-slateCard text-gray-400';
        return `
          <button type="button" data-filter="category" data-val="${cat}" class="filter-pill shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border text-xs transition cursor-pointer ${cls}">
            <span>${escapeHtml(t.categories[cat])}</span>
            <span class="px-1.5 py-0.2 rounded-md text-[10px] font-mono font-bold ${cntCls}">${catCounts[cat]}</span>
          </button>
        `;
      }).join('');

      // Show "Reset Filters" button if any filter/search is active
      const hasActive = Boolean(
        state.query.trim() ||
        state.region !== 'all' ||
        state.reward !== 'all' ||
        state.category !== 'all' ||
        state.uncompletedOnly
      );
      document.getElementById('resetAllFiltersBtn').classList.toggle('hidden', !hasActive);
    }

    function renderCodeBlock(item) {
      const t = I18N[state.lang];
      const isMulti = item.codes.length > 1;

      if (isMulti) {
        return `
          <div class="space-y-2">
            ${item.codes.map((c) => {
              const label = state.lang === 'ko' ? c.labelKo : c.labelEn;
              const leadingZero = c.code.startsWith('0');
              return `
                <button
                  type="button"
                  data-copy="${escapeHtml(c.code)}"
                  class="copy-code-btn group w-full flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-xl bg-obsidian hover:bg-cyan-400/10 border border-borderCrisp hover:border-viceCyan/60 transition cursor-pointer"
                >
                  <div class="flex flex-wrap items-center gap-1.5 min-w-0">
                    <span class="text-xs font-semibold text-gray-400 group-hover:text-cyan-200 transition">${escapeHtml(label)}</span>
                    ${leadingZero ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-amber-500/15 text-amber-300 border border-amber-500/35">${escapeHtml(t.leadingZeroBadge)}</span>` : ''}
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="font-mono code-digits text-xl font-extrabold tracking-widest text-white group-hover:text-viceCyan transition">${escapeHtml(c.code)}</span>
                    <svg class="w-4 h-4 text-gray-500 group-hover:text-viceCyan transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      const c = item.codes[0];
      const leadingZero = c.code.startsWith('0');
      const hasAlt = Boolean(c.alt);

      return `
        <div class="flex items-stretch gap-2">
          <button
            type="button"
            data-copy="${escapeHtml(c.code)}"
            class="copy-code-btn group flex-1 flex items-center justify-between gap-2 px-4 py-3 rounded-xl bg-obsidian hover:bg-cyan-400/10 border border-borderCrisp hover:border-viceCyan/60 transition cursor-pointer"
          >
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-mono code-digits text-2xl font-extrabold tracking-[0.14em] text-white group-hover:text-viceCyan transition">${escapeHtml(c.code)}</span>
              ${leadingZero ? `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-extrabold bg-amber-500/15 text-amber-300 border border-amber-500/35 whitespace-nowrap">${escapeHtml(t.leadingZeroBadge)}</span>` : ''}
            </div>
            <svg class="w-4 h-4 text-gray-500 group-hover:text-viceCyan transition shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>

          ${hasAlt ? `
            <button
              type="button"
              data-copy="${escapeHtml(c.alt)}"
              class="copy-code-btn group flex flex-col items-center justify-center px-3 py-2 rounded-xl bg-obsidian hover:bg-amber-500/10 border border-borderCrisp hover:border-amber-400/50 transition cursor-pointer shrink-0"
              title="${escapeHtml(t.altLabel)}: ${escapeHtml(c.alt)}"
            >
              <span class="text-[9px] font-extrabold uppercase tracking-wider text-amber-400/85 leading-none mb-1">${escapeHtml(t.altLabel)}</span>
              <span class="font-mono code-digits text-sm font-extrabold tracking-wider text-amber-200 group-hover:text-amber-300">${escapeHtml(c.alt)}</span>
            </button>
          ` : ''}
        </div>
      `;
    }

    function renderAll() {
      const t = I18N[state.lang];
      const searchResults = runFuzzySearch(state.query);

      renderFilterBars(searchResults);

      const filtered = searchResults.filter((entry) => matchesFilters(entry.item, null));

      // Clear search X button visibility
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !state.query.length);

      // Summary bar
      const summaryEl = document.getElementById('resultSummary');
      summaryEl.textContent = state.query.trim()
        ? t.summarySearch(filtered.length, state.query.trim())
        : t.summaryAll(filtered.length, LOCATIONS.length);

      const grid = document.getElementById('cardsGrid');
      const empty = document.getElementById('emptyState');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');

      grid.innerHTML = filtered.map(({ item, isFuzzy }) => {
        const isChecked = state.checkedIds.has(item.id);
        const primaryName = state.lang === 'ko' ? item.ko : item.en;
        const secondaryName = state.lang === 'ko' ? item.en : item.ko;
        const regionText = t.regions[item.region];
        const subRegion = state.lang === 'ko' ? item.subRegionKo : item.subRegionEn;
        const tipText = state.lang === 'ko' ? item.tipKo : item.tipEn;
        const clueText = state.lang === 'ko' ? item.clueKo : item.clueEn;
        const rewardDetail = state.lang === 'ko' ? item.rewardDetailKo : item.rewardDetailEn;
        const clueOpen = state.expandedClues.has(item.id);

        const encodedEn = encodeURIComponent(item.en);
        const ytUrl = `https://www.youtube.com/results?search_query=GTA+6+${encodedEn}+safe+location`;
        const mapUrl = `https://www.google.com/search?q=GTA+6+map+${encodedEn}+location`;

        return `
          <article
            id="card-${escapeHtml(item.id)}"
            class="flex flex-col justify-between rounded-2xl border p-4 transition-all duration-150 ${
              isChecked
                ? 'bg-[#0E1017] border-emerald-500/30 opacity-60 hover:opacity-100'

            }"
          >
            <div class="space-y-3">
              <!-- Top Row: Region + Reward Badges + Completion Checkbox -->
              <div class="flex items-start justify-between gap-2">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-obsidian text-gray-300 border border-borderCrisp">
                    ${escapeHtml(regionText)}${subRegion && subRegion !== regionText && subRegion !== 'Open World' && subRegion !== '오픈월드' ? ` · ${escapeHtml(subRegion)}` : ''}
                  </span>
                  ${item.rewards.map((rw) => `
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-bold border ${getRewardBadgeClass(rw)}">
                      <span class="text-[10px]">${getRewardIcon(rw)}</span>
                      <span>${escapeHtml(t.rewards[rw])}</span>
                    </span>
                  `).join('')}
                  ${isFuzzy ? `
                    <span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-cyan-400/15 text-viceCyan border border-cyan-400/30">
                      ${escapeHtml(t.fuzzyBadge)}
                    </span>
                  ` : ''}
                </div>

                <!-- Completion Checkbox -->
                <button
                  type="button"
                  data-check="${escapeHtml(item.id)}"
                  title="${escapeHtml(t.doneTooltip)}"
                  aria-pressed="${isChecked}"
                  class="check-toggle-btn shrink-0 w-7 h-7 rounded-lg flex items-center justify-center border transition cursor-pointer ${
                    isChecked
                      ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300'
                      : 'bg-obsidian border-borderCrisp text-gray-600 hover:border-gray-400 hover:text-gray-200'
                  }"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24">
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                </button>
              </div>

              <!-- Location Title (Always shows both English official signage & Korean name) -->
              <div>
                <h2 class="text-[15px] font-extrabold leading-snug ${isChecked ? 'line-through text-gray-400' : 'text-white'}">
                  ${escapeHtml(primaryName)}
                </h2>
                <p class="text-xs text-gray-400/90 mt-0.5 font-medium">${escapeHtml(secondaryName)}</p>
              </div>

              <!-- Highlighted Special Reward Callout (Unique Weapon / Vehicle / Collectible) -->
              ${rewardDetail ? `
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-extrabold ${
                  item.rewards.includes('weapon')
                    ? 'bg-gradient-to-r from-amber-500/20 to-rose-500/15 text-amber-200 border border-amber-400/35'
                    : item.rewards.includes('vehicle')
                    ? 'bg-cyan-400/15 text-cyan-200 border border-cyan-400/35'
                    : 'bg-purple-500/15 text-purple-200 border border-purple-400/35'
                }">
                  <span>${getRewardIcon(item.rewards[0])}</span>
                  <span>${escapeHtml(rewardDetail)}</span>
                </div>

              <!-- Code Copy Buttons -->
              <div>
                ${renderCodeBlock(item)}
              </div>

              <!-- Entry Tip & Optional Collapsible Clue -->
              <div class="rounded-xl bg-obsidian/70 border border-borderCrisp/80 px-3 py-2.5 space-y-1.5">
                <p class="text-xs text-gray-300 leading-relaxed">

                      type="button"

            <div class="mt-3.5 pt-3 border-t border-borderCrisp/70 grid grid-cols-3 gap-1.5">
              <a
                href="${ytUrl}"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center justify-center gap-1.5 px-2 py-2 rounded-xl bg-obsidian hover:bg-rose-500/15 border border-borderCrisp hover:border-rose-500/40 text-[11px] font-bold text-gray-300 hover:text-rose-200 transition"
              >
                <svg class="w-3.5 h-3.5 text-rose-400 shrink-0" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
                </svg>
                <span class="truncate">${escapeHtml(t.ytBtn)}</span>
              </a>

              <a
                href="${mapUrl}"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center justify-center gap-1.5 px-2 py-2 rounded-xl bg-obsidian hover:bg-cyan-400/15 border border-borderCrisp hover:border-viceCyan/40 text-[11px] font-bold text-gray-300 hover:text-cyan-200 transition"
              >
                <svg class="w-3.5 h-3.5 text-viceCyan shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span class="truncate">${escapeHtml(t.mapBtn)}</span>
              </a>

              <button
                type="button"
                data-share-id="${escapeHtml(item.id)}"
                class="share-card-btn inline-flex items-center justify-center gap-1.5 px-2 py-2 rounded-xl bg-obsidian hover:bg-gray-800 border border-borderCrisp hover:border-gray-500 text-[11px] font-bold text-gray-300 hover:text-white transition cursor-pointer"
              >
                <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                <span class="truncate">${escapeHtml(t.shareBtn)}</span>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    /**
     * =========================================================================
     * 7. DEEP-LINK HASH NAVIGATION (#item-id)
     * =========================================================================
     */
    function jumpToHashTarget() {
      const rawHash = window.location.hash ? decodeURIComponent(window.location.hash.slice(1)) : '';
      if (!rawHash) return;

      const targetItem = LOCATIONS.find((x) => x.id === rawHash);
      if (!targetItem) return;

      // Ensure card is visible even if filters were previously applied
      let needsRerender = false;
      if (state.query || state.region !== 'all' || state.reward !== 'all' || state.category !== 'all' || state.uncompletedOnly) {
        state.query = '';
        state.region = 'all';
        state.reward = 'all';
        state.category = 'all';
        state.uncompletedOnly = false;
        document.getElementById('searchInput').value = '';
        updateProgressUI();
        needsRerender = true;
      }
      if (needsRerender) renderAll();

      requestAnimationFrame(() => {
        const cardEl = document.getElementById(`card-${targetItem.id}`);
        if (!cardEl) return;
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cardEl.classList.remove('hash-highlight');
        void cardEl.offsetWidth;
        cardEl.classList.add('hash-highlight');
      });
    }

    /**
     * =========================================================================
     * 8. EVENT HANDLERS & MODAL CONTROLS
     * =========================================================================
     */
    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function resetAllFilters() {
      state.query = '';
      state.region = 'all';
      state.reward = 'all';
      state.category = 'all';
      state.uncompletedOnly = false;
      document.getElementById('searchInput').value = '';
      updateProgressUI();
      renderAll();
    }

    function bindEvents() {
      const searchInput = document.getElementById('searchInput');

      searchInput.addEventListener('input', (e) => {
        state.query = e.target.value;
        renderAll();
      });

      document.getElementById('clearSearchBtn').addEventListener('click', () => {
        state.query = '';
        searchInput.value = '';
        searchInput.focus();
        renderAll();
      });

      document.getElementById('resetAllFiltersBtn').addEventListener('click', resetAllFilters);
      document.getElementById('emptyResetBtn').addEventListener('click', () => {
        resetAllFilters();
        searchInput.focus();
      });

      // Uncompleted only toggle
      document.getElementById('uncompletedToggleBtn').addEventListener('click', () => {
        state.uncompletedOnly = !state.uncompletedOnly;
        updateProgressUI();
        renderAll();
      });

      // Language toggle
      document.getElementById('langKoBtn').addEventListener('click', () => {
        if (state.lang !== 'ko') {
          state.lang = 'ko';
          persistLang();
          updateStaticChrome();
          updateProgressUI();
          renderAll();
        }
      });
      document.getElementById('langEnBtn').addEventListener('click', () => {
        if (state.lang !== 'en') {
          state.lang = 'en';
          persistLang();
          updateStaticChrome();
          updateProgressUI();
          renderAll();
        }
      });

      // Delegated filter bar clicks
      ['regionFilterBar', 'rewardFilterBar', 'categoryFilterBar'].forEach((barId) => {
        document.getElementById(barId).addEventListener('click', (e) => {
          const pill = e.target.closest('.filter-pill');
          if (!pill) return;
          const type = pill.dataset.filter;
          const val = pill.dataset.val;
          state[type] = val;
          renderAll();
        });
      });

      // Delegated card interactions (Copy Code / Check Done / Toggle Clue / Copy Direct Share Link)
      document.getElementById('cardsGrid').addEventListener('click', (e) => {
        const copyBtn = e.target.closest('.copy-code-btn');
        if (copyBtn) {
          const code = copyBtn.dataset.copy;
          copyToClipboard(code);
          showToast(I18N[state.lang].copiedCode(code));
          copyBtn.classList.add('!border-emerald-400', '!bg-emerald-500/20');
          setTimeout(() => copyBtn.classList.remove('!border-emerald-400', '!bg-emerald-500/20'), 650);
          return;
        }

        const checkBtn = e.target.closest('.check-toggle-btn');
        if (checkBtn) {
          const id = checkBtn.dataset.check;
          if (state.checkedIds.has(id)) state.checkedIds.delete(id);
          else state.checkedIds.add(id);
          persistChecked();
          updateProgressUI();
          renderAll();
          return;
        }

        const clueBtn = e.target.closest('.clue-toggle-btn');
        if (clueBtn) {
          const id = clueBtn.dataset.clueToggle;
          if (state.expandedClues.has(id)) state.expandedClues.delete(id);
          else state.expandedClues.add(id);
          renderAll();
          return;
        }

        const shareBtn = e.target.closest('.share-card-btn');
        if (shareBtn) {
          const id = shareBtn.dataset.shareId;
          const baseUrl = window.location.href.split('#')[0];
          const directUrl = `${baseUrl}#${id}`;
          copyToClipboard(directUrl);
          showToast(I18N[state.lang].copiedShare);
        }
      });

      // Copy full site URL button
      document.getElementById('copyPageUrlBtn').addEventListener('click', () => {
        const baseUrl = window.location.href.split('#')[0];
        copyToClipboard(baseUrl);
        showToast(I18N[state.lang].copiedPageUrl);
      });

      // Guide modal events
      document.getElementById('openGuideModalBtn').addEventListener('click', () => openModal('guideModal'));
      document.getElementById('closeGuideModalBtn').addEventListener('click', () => closeModal('guideModal'));
      document.getElementById('guideModalOkBtn').addEventListener('click', () => closeModal('guideModal'));
      document.getElementById('guideModal').addEventListener('click', (e) => {
        if (e.target.id === 'guideModal') closeModal('guideModal');
      });

      // Reset progress confirmation modal events
      document.getElementById('openResetModalBtn').addEventListener('click', () => openModal('resetModal'));
      document.getElementById('cancelResetBtn').addEventListener('click', () => closeModal('resetModal'));
      document.getElementById('resetModal').addEventListener('click', (e) => {
        if (e.target.id === 'resetModal') closeModal('resetModal');
      });
      document.getElementById('confirmResetBtn').addEventListener('click', () => {
        state.checkedIds.clear();
        persistChecked();
        updateProgressUI();
        renderAll();
        closeModal('resetModal');
        showToast(I18N[state.lang].resetDoneToast);
      });

      // Global keyboard shortcuts: '/' focuses search, 'Escape' closes modals or clears search
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (!document.getElementById('guideModal').classList.contains('hidden')) {
            closeModal('guideModal');
            return;
          }
          if (!document.getElementById('resetModal').classList.contains('hidden')) {
            closeModal('resetModal');
            return;
          }
          if (state.query) {
            state.query = '';
            searchInput.value = '';
            renderAll();
          }
          return;
        }
        if (e.key === '/' && document.activeElement !== searchInput && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        }
      });

      window.addEventListener('hashchange', jumpToHashTarget);
    }

    // Initialize App
    loadPersistedState();
    updateStaticChrome();
    updateProgressUI();
    bindEvents();
    renderAll();
    jumpToHashTarget();
  </script>
</body>
</html>
